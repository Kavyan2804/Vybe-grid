services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridpilot
      POSTGRES_PASSWORD: gridpilot
      POSTGRES_DB: gridpilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpilot -d gridpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gridpilot_db_data:/var/lib/postgresql/data   # named volume — survives `compose down`

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://gridpilot:gridpilot@db:5432/gridpilot
      BACKEND_URL: http://backend:8000
    ports:
      - "8000:8000"
    volumes:
      - ./optimizer:/app/optimizer
      - ./backend/src:/app/src

  dashboard:
    build:
      context: ./dashboard
    env_file:
      - path: .env
        required: false
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  gridpilot_db_data:
