[project]
name = "gridpilot-backend"
version = "0.1.0"
description = "FastAPI backend for GridPilot — scheduler, API, SSE, and DB layer. See docs/architecture/API_CONTRACT.md."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    # The scheduler calls into optimizer/ (backend/src/services/optimizer_bridge.py) in-process,
    # so its dependencies have to be installed here too — there is no packaging boundary between
    # the two at runtime, only at the directory-ownership level (REPO_STRUCTURE.md §10).
    "pyomo>=6.7",
    "highspy>=1.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.7",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
