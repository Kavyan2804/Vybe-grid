[project]
name = "gridpilot-optimizer"
version = "0.1.0"
description = "Rolling-horizon MILP dispatch optimizer for off-grid microgrids — the Clean Architecture core (domain + application + infrastructure). See docs/architecture/ARCHITECTURE.md."
requires-python = ">=3.11"
dependencies = [
    "pyomo>=6.7",
    "highspy>=1.7",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "optimizer" = "." }
packages = [
    "optimizer",
    "optimizer.application",
    "optimizer.domain",
    "optimizer.infrastructure",
    "optimizer.infrastructure.db",
    "optimizer.infrastructure.dispatch_hardware",
    "optimizer.infrastructure.dispatch_simulator",
    "optimizer.infrastructure.forecast_openmeteo",
    "optimizer.infrastructure.optimizer_pyomo",
    "optimizer.sites",
    "optimizer.tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
